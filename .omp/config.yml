# OMP settings for this repo checkout. OMP reads only the `.omp/` of its current
# working directory (it does not walk ancestors), so each project holds symlinks
# to the files here:
#
#   job_postings/.omp/{mcp.json,config.yml,RULES.md}    -> ../../.omp/...
#   reddit_pipeline/.omp/{mcp.json,config.yml,RULES.md} -> ../../.omp/...
#   kafka_streams/.omp/{mcp.json,config.yml,RULES.md}   -> ../../.omp/...
#
# RULES.md needs its own link even though it is not a settings file: native
# sticky-rule discovery stops at the nearest non-empty `.omp/`, so from inside a
# project directory the root `.omp/RULES.md` alone would not load. A new
# subproject that gains a non-empty `.omp/` needs all three links, or the rule
# silently disappears there. A directory with no `.omp/` gets neither the rules
# nor the MCP server — OMP does not walk ancestors — so `kafka_streams/` carries
# the same three links rather than inheriting them.
#
# Keep the definitions at the checkout root; edit them once and all three
# projects pick the change up.
#
# One Databricks SQL MCP service, `system.ai.dbsql` — Databricks' own, on the
# Express-trial workspace `dbc-280fcd4a-642e.cloud.databricks.com`. It advertises
# `execute_sql` and `poll_sql_result`, and `execute_sql` is capable of writes.
#
# The read-only guarantee is therefore the caller's identity, not a tool name:
#
#   1. `.omp/mcp.json` sends `Authorization: Bearer <token>` for the service
#      principal `omp-dbsql-ro` (applicationId 2848e97e-e449-400f-9088-c33275d535d0).
#      The header is produced per connection by `~/.config/omp/dbsql-token.py`,
#      which mints an OAuth M2M token (client_credentials, scope `all-apis`) from
#      the client secret in `~/.config/omp/dbsql-client.json` (mode 600, expires
#      2028-10-23) and caches it in `~/.config/omp/.dbsql-token-cache` for its
#      one-hour life. It is not the caller's identity, so no human token reaches
#      the server.
#   2. That principal holds exactly: USE_CATALOG on `workspace`; USE_SCHEMA and
#      SELECT on `workspace.job_postings`, `workspace.reddit`,
#      `workspace.topic_raw`; CAN_USE on warehouse `5c5d597ca7af9460`. It has no
#      CREATE/INSERT/UPDATE/DELETE/MODIFY anywhere, so a write fails in Unity
#      Catalog with `PERMISSION_DENIED`, whatever the MCP tool set allows.
#      `system` and `system.ai` access is inherited from its `account users`
#      membership — the workspace user is not a metastore admin and cannot grant
#      on the `system` catalog directly.
#   3. What used to be a third layer here — a `tools.approval` deny on
#      `mcp__databricks_execute_sql` — is deliberately gone. On the retired
#      server it denied the write tool while `execute_sql_read_only` stayed
#      callable. `system.ai.dbsql` has no read-only variant, so the same deny now
#      blocks the only SQL tool and leaves MCP unusable, which is not a safety
#      property. Layer 2 is the boundary; `RULES.md` keeps the write gate for the
#      fallback identity, which is where writes can actually happen.
#
# A write attempted through MCP does not surface as an HTTP error. `execute_sql`
# returns HTTP 200 with a body whose `status.state` is `FAILED`, `error_code`
# `BAD_REQUEST`, `sql_state` `42501`, and a `PERMISSION_DENIED: Principal
# 'omp-dbsql-ro' does not have ...` message; `isError` stays `false`. Read the
# body, not the status code.
#
# The fallback identity is different: the Databricks user `ak547276@gmail.com`
# (CLI profile `DEFAULT`) owns every schema in `workspace` and can write. That is
# why `RULES.md` gates writes absolutely rather than relying on this server.

