# dbt profile for this repo, used by `dbt` from this directory via the
# `profiles.yml` symlink, or explicitly with `--profiles-dir profiles`.
#
# It authenticates with a token minted from the same Databricks CLI profile the
# loader uses (`databricks auth login`), so one login covers both ingestion and
# the mart build. Host and http path come from `.env` — the same values the
# loader connects with — so the two halves cannot disagree about which workspace
# they write to.
#
# The profile lives here rather than in ~/.dbt so the repo carries its own
# authentication story. A hand-run `dbt` still needs the token exported:
#
#   export DATABRICKS_HOSTNAME=... DATABRICKS_HTTP_PATH=... DATABRICKS_TOKEN=...
#   DBT_PROFILES_DIR=profiles dbt build
bluesky:
  target: dev
  outputs:
    dev:
      type: databricks
      catalog: workspace
      schema: bluesky
      host: "{{ env_var('DATABRICKS_HOSTNAME') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      threads: 4
