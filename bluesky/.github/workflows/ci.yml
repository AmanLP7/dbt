name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bluesky
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches ruff target-version and pyright pythonVersion in pyproject.toml.
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            bluesky/requirements.txt
            bluesky/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # ruff and pyright resolve imports against the environment installed above.
      - name: ruff format
        run: ruff format --check .

      - name: ruff check
        run: ruff check .

      # No path given: lints every .sql in the project, honouring ignore_paths
      # in .sqlfluff.
      - name: sqlfluff
        run: sqlfluff lint

      - name: pyright
        run: pyright

      # Offline project parse: no warehouse connection, so dummy credentials are
      # enough. Catches invalid source/property changes the linters cannot see.
      - name: dbt parse
        env:
          DATABRICKS_HOSTNAME: https://example.invalid
          DATABRICKS_HTTP_PATH: /sql/1.0/warehouses/000
          DATABRICKS_TOKEN: dapi-ci-placeholder
        run: dbt parse --profiles-dir profiles

      # Behaviour tests for the loader and the cost model: a SQLite file built per
      # test, a fake warehouse, no network.
      - name: pytest
        run: pytest

  workflow-lint:
    name: Lint workflow files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned image. Checks .github/workflows/*.yml: syntax, expression
      # contexts, and known action inputs/outputs.
      - uses: docker://rhysd/actionlint:1.7.7
