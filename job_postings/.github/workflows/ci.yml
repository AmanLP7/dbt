name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches ruff target-version and pyright pythonVersion in pyproject.toml.
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          # The orchestration package is what imports dagster/dagster_dbt, so pyright
          # resolves them through this install and the definitions-validate step below
          # loads exactly what a deployment would.
          pip install -e ./orchestration

      # ruff and pyright resolve imports against the environment installed above.
      - name: ruff format
        run: ruff format --check .

      - name: ruff check
        run: ruff check .

      # No path given: lints every .sql in the project (models/ and macros/),
      # honouring ignore_paths in .sqlfluff.
      - name: sqlfluff
        run: sqlfluff lint

      - name: pyright
        run: pyright

      # Offline project parse: no warehouse connection, so dummy credentials are
      # enough. Catches invalid model/yml/property changes the linters cannot see.
      - name: dbt parse
        env:
          DATABRICKS_HOSTNAME: https://example.invalid
          DATABRICKS_HTTP_PATH: /sql/1.0/warehouses/000
          DATABRICKS_TOKEN: dapi-ci-placeholder
        run: dbt parse --profiles-dir profiles

      # Loads the Dagster code location against the manifest dbt parse just wrote:
      # the orchestration package, the asset keys, and the job/schedule wiring. Still
      # no warehouse connection, so the same dummy credentials are enough.
      - name: dagster definitions validate
        env:
          DATABRICKS_HOSTNAME: https://example.invalid
          DATABRICKS_HTTP_PATH: /sql/1.0/warehouses/000
          DATABRICKS_TOKEN: dapi-ci-placeholder
        run: dagster definitions validate -m job_postings_orchestration.definitions

      # Behaviour tests for the extractor, the raw-table contract and the Dagster
      # definitions (stubbed HTTP and Dagster's in-process materialization; no
      # network, no warehouse). tests/test_definitions.py resolves the code location,
      # so it reads the manifest the `dbt parse` step above wrote — keep that order.
      - name: pytest
        run: pytest

  workflow-lint:
    name: Lint workflow files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned image. Checks .github/workflows/*.yml: syntax, expression
      # contexts, and known action inputs/outputs.
      - uses: docker://rhysd/actionlint:1.7.7
