# One Kafka broker for every flow under kafka_streams/.
#
# Single node in KRaft mode: no ZooKeeper, the same process is broker and
# controller. Sizing follows README.md §8 — a 512 MiB heap plus a 1 GiB cgroup
# limit, so an OOM kills this container rather than Dagster.
#
# Flows share the broker and own their topic (wikimedia/ uses
# `wikimedia.recentchange`). Auto topic creation is off on purpose: a typo in a
# topic name should fail loudly, not silently start writing to a new topic.
name: kafka_streams

services:
  kafka:
    # Pinned: `latest` re-pulls silently and can change KRaft defaults between
    # restarts. The measured digest is in README.md §8.
    image: apache/kafka:4.3.1
    container_name: kafka_streams-broker
    environment:
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
      # Without this the image writes its log segments to its own default
      # directory and the named volume below stays empty, so `docker compose
      # down` (no -v) loses the topic.
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: "168"
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      # A TCP probe, not `kafka-topics.sh`: that would start a second JVM every
      # 10 s inside the same 1 GiB cgroup as a 512 MiB-heap broker.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9092'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  kafka-data:
    name: kafka_streams_data
